[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sourcestate"
version = "0.3.0"
description = "Auditable source-to-claim research prototype for humanities and social sciences"
requires-python = ">=3.11"
dependencies = [
  "gradio>=5.0",
  "pandas>=2.0",
  "PyMuPDF>=1.24",
  "numpy>=1.26",
  "scikit-learn>=1.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sourcestate*"]
